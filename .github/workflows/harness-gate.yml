name: Harness gate

on:
  pull_request:
    branches: [main, preview]

permissions:
  contents: read

jobs:
  harness:
    name: Validate .harness/ contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Run harness check
        env:
          HARNESS_BASE_REF: origin/${{ github.base_ref }}
        run: bash scripts/check-harness.sh

  validate:
    name: Lint, build, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test
